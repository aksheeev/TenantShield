name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tenantshield
          POSTGRES_PASSWORD: change_me_locally
          POSTGRES_DB: tenantshield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenantshield -d tenantshield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://tenantshield:change_me_locally@localhost:5432/tenantshield
      DATABASE_APP_URL: postgresql+psycopg://tenantshield_app:change_me_locally@localhost:5432/tenantshield
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Apply migrations (creates tables, RLS policies, app role)
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v